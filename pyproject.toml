[tool.poetry]
name = "factors-no-more"
version = "0.1.0"
description = "Guardrails and causal-epi utilities that operationalize 'ditch the factors associated with' analyses."
authors = ["Diogo Ribeiro <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "factors_no_more", from = "src" }]
keywords = ["causal inference", "epidemiology", "multiplicity", "guardrails"]
homepage = "https://github.com/your-org/factors-no-more"
repository = "https://github.com/your-org/factors-no-more"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^2.2.6"
pandas = "^2.2.0"
statsmodels = "^0.14.0"
typing-extensions = "^4.10.0"

[tool.poetry.group.dev.dependencies]
python-semantic-release = "^10.4.1"
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
mkdocstrings = {version = "^1.0.0", extras=["python"]}

pytest = "^9.0.0"
pytest-cov = "^7.0.0"
mypy = "^1.10.0"
ruff = "^0.15.0"
types-python-dateutil = "*"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]
ignore = []
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
show_error_codes = true
namespace_packages = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.semantic_release]
version_source = "tag"
commit_parser = "angular"
changelog_file = "CHANGELOG.md"
build_command = "poetry build"
upload_to_pypi = true
upload_to_vcs_release = true
version_toml = ["pyproject.toml:tool.poetry.version"]
